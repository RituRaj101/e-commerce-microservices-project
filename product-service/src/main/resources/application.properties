spring.application.name=product-service
server.port=8082

# ---- Database (Oracle 21c) ----
# Uses its own schema/user, separate from user-service's - each
# microservice owns its own database in a proper microservices setup.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=MYDB9AM
spring.datasource.password=MYDB9AM
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Redis ----
# Default local Redis install - update host/port if yours differs
# (e.g. a Docker container mapped to a different port).
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=          # uncomment and set if your Redis requires auth

# ---- Eureka client ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
