spring.application.name=order-service
server.port=8084

# ---- Database (Oracle 21c) ----
# Own schema, separate from user-service and product-service.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=MYDB9AM
spring.datasource.password=MYDB9AM
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Eureka client ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- Feign / Product Service call timeouts ----
# How long Feign waits before giving up on Product Service. Without these,
# Feign's defaults can leave a request hanging if Product Service is slow
# or unresponsive - important to know for interview questions about
# resilience between services.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000
